apiVersion: modos.pleiades/v1alpha1
kind: Component
metadata:
  name: pleiades-defensive-substrate
  repository: Zheke32174/pleiades
  visibility: public
  lifecycle: canonical
  defaultBranch: main
  labels:
    ecology-scope: public-constitution
    organ-class: governance-substrate
spec:
  roles:
    - public-constitutional-surface
    - defensive-node-substrate
    - ecology-schema-owner
    - forensic-event-source
  authority: local-enforcement
  inputs:
    - signed-domain-instructions
    - host-and-container-telemetry
    - steward-approved-configuration
    - ecology-change-proposals
  outputs:
    - signed-audit-events
    - defensive-observations
    - public-contract-schemas
    - ecology-validation-receipts
  capabilitiesProvided:
    - governance.contract.validate@v1alpha1
    - telemetry.defensive@v1alpha1
    - audit.append@v1alpha1
  capabilitiesRequired:
    - host.kernel.local@v1alpha1
    - filesystem.local@v1alpha1
  dataClasses:
    - public
    - internal
    - evidence
    - untrusted
  failurePolicy: degrade-local
  promotionPolicy: evidence-gated
  relations:
    - type: canonical-for
      targetRef: scope:constitution/public-modos-contracts
      scope: governance
      required: true
    - type: supports
      targetRef: repo:Zheke32174/undergrowth
      scope: governance
      required: true
    - type: provides-capability
      targetRef: capability:governance.contract.validate@v1alpha1
      scope: governance
      required: true
    - type: provides-capability
      targetRef: capability:telemetry.defensive@v1alpha1
      scope: observation
      required: true
  notes: >-
    Pleiades owns the public constitutional vocabulary and the local defensive
    substrate. Catalog membership never grants execution authority. The compiled
    PDK reference remains a separately promoted implementation surface until its
    live-system gates are satisfied.

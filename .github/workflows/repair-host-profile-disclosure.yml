name: Repair host profile disclosure

on:
  push:
    branches:
      - governance/convergence-proof-v1
    paths:
      - '.github/workflows/repair-host-profile-disclosure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: governance/convergence-proof-v1
      - name: Replace identity-bearing profile paths with runtime discovery
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/pleiades-install-host-autostart.sh')
          lines = path.read_text().splitlines(keepends=True)
          if any('detect_windows_profile()' in line for line in lines):
              raise SystemExit('profile discovery is already present')

          root_line = '[[ "${EUID:-$(id -u)}" -ne 0 ]] && die "Must run as root (try: sudo bash $0)"\n'
          root_indexes = [index for index, line in enumerate(lines) if line == root_line]
          if len(root_indexes) != 1:
              raise SystemExit(f'expected one root-check line, found {len(root_indexes)}')

          block = '''

detect_windows_profile() {
  local raw_profile=""
  if command -v cmd.exe >/dev/null 2>&1 && command -v wslpath >/dev/null 2>&1; then
    raw_profile="$(cmd.exe /C 'echo %USERPROFILE%' 2>/dev/null | tr -d '\\r\\n')"
    if [[ -n "$raw_profile" && "$raw_profile" != "%USERPROFILE%" ]]; then
      wslpath -u "$raw_profile"
      return 0
    fi
  fi

  local candidate=""
  while IFS= read -r candidate; do
    case "${candidate##*/}" in
      Public|Default|"Default User"|"All Users") continue ;;
    esac
    printf '%s\\n' "$candidate"
    return 0
  done < <(find /mnt/c/Users -mindepth 1 -maxdepth 1 -type d -print 2>/dev/null | sort)
  return 1
}

WINDOWS_PROFILE="$(detect_windows_profile)" || die "Unable to determine the Windows profile directory"
WINDOWS_USER="${WINDOWS_PROFILE##*/}"
VBS_DIR="$WINDOWS_PROFILE/AppData/Roaming/Microsoft/Windows/Start Menu/Programs/Startup"
VBS_PATH="$VBS_DIR/Pleiades-WSL-Start.vbs"
'''.splitlines(keepends=True)
          insert_at = root_indexes[0] + 1
          lines[insert_at:insert_at] = block

          uninstall_indexes = [
              index for index, line in enumerate(lines)
              if line.startswith('  VBS_PATH="/mnt/c/Users/') and line.rstrip().endswith('/Pleiades-WSL-Start.vbs"')
          ]
          if len(uninstall_indexes) != 1:
              raise SystemExit(f'expected one hardcoded uninstall path, found {len(uninstall_indexes)}')
          del lines[uninstall_indexes[0]]

          start_indexes = [index for index, line in enumerate(lines) if line == 'WINDOWS_USER="Fixxia"\n']
          if len(start_indexes) != 1:
              raise SystemExit(f'expected one legacy Windows user line, found {len(start_indexes)}')
          start = start_indexes[0]
          end = None
          for index in range(start, min(start + 20, len(lines))):
              if lines[index] == 'VBS_PATH="$VBS_DIR/Pleiades-WSL-Start.vbs"\n':
                  end = index
                  break
          if end is None:
              raise SystemExit('legacy profile block end was not found')
          lines[start:end + 1] = ['log "Windows user: $WINDOWS_USER"\n']

          path.write_text(''.join(lines))
          PY
      - name: Verify syntax and current-tree privacy
        run: |
          bash -n scripts/pleiades-install-host-autostart.sh
          python ci/scan-public-history.py \
            --mode current \
            --report artifacts/current-tree-sensitivity-receipt.json
      - name: Commit privacy repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/pleiades-install-host-autostart.sh
          git commit -m "Discover Windows profile without public identity literals"
          git fetch --no-tags origin governance/convergence-proof-v1
          git rebase origin/governance/convergence-proof-v1
          git push origin HEAD:governance/convergence-proof-v1

name: Temporary capture Clippy output

on:
  push:
    branches:
      - storage/controller-observation-reads-v1
    paths:
      - 'modos/pdk-node-agent/crates/pdk-controller/src/heartbeat_read_store.rs'
      - 'modos/pdk-node-agent/crates/pdk-controller/src/heartbeat_read_tests.rs'
      - 'modos/pdk-node-agent/crates/pdk-controller/src/main.rs'
      - '.github/workflows/temporary-capture-clippy.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: storage/controller-observation-reads-v1
          show-progress: false
      - name: Install stable Rust with Clippy
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Install Protobuf compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
      - name: Capture Clippy result
        shell: bash
        run: |
          set +e
          cd modos/pdk-node-agent
          cargo clippy --workspace --all-targets --all-features -- -D warnings > ../../docs/TEMP_CLIPPY_OUTPUT.txt 2>&1
          status=$?
          cd ../..
          printf '\nCLIPPY_EXIT_STATUS=%s\n' "$status" >> docs/TEMP_CLIPPY_OUTPUT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/TEMP_CLIPPY_OUTPUT.txt
          git commit -m 'ci: capture temporary Clippy diagnostics'
          git push origin HEAD:storage/controller-observation-reads-v1

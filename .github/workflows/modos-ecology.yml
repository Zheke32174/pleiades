name: Validate MODOS ecology

on:
  push:
    paths:
      - 'MODOS_COMPONENT.yaml'
      - 'modos/contracts/component-manifest.schema.json'
      - 'modos/contracts/ecology-registry.schema.json'
      - 'modos/ecology/**'
      - 'ci/validate-ecology.py'
      - '.github/workflows/modos-ecology.yml'
  pull_request:
    paths:
      - 'MODOS_COMPONENT.yaml'
      - 'modos/contracts/component-manifest.schema.json'
      - 'modos/contracts/ecology-registry.schema.json'
      - 'modos/ecology/**'
      - 'ci/validate-ecology.py'
      - '.github/workflows/modos-ecology.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modos-ecology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned validators
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          jsonschema==4.26.0 PyYAML==6.0.2
      - name: Compile deterministic validators
        run: python -m py_compile ci/validate-ecology.py
      - name: Validate component manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          from jsonschema import Draft202012Validator

          schema = json.loads(Path('modos/contracts/component-manifest.schema.json').read_text())
          manifest = yaml.safe_load(Path('MODOS_COMPONENT.yaml').read_text())
          Draft202012Validator.check_schema(schema)
          errors = sorted(Draft202012Validator(schema).iter_errors(manifest), key=lambda error: list(error.path))
          if errors:
              for error in errors:
                  print('/'.join(map(str, error.absolute_path)), error.message)
              raise SystemExit(1)
          print('component manifest valid')
          PY
      - name: Prove public ecology projection closure
        run: |
          mkdir -p artifacts
          python ci/validate-ecology.py \
            --registry modos/ecology/public-ecology.json \
            --schema modos/contracts/ecology-registry.schema.json \
            --report artifacts/public-ecology-closure.json
      - name: Upload closure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modos-public-ecology-closure-${{ github.sha }}
          path: artifacts/public-ecology-closure.json
          if-no-files-found: error
          retention-days: 30

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag, for example v0.1.0'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned validators
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          -r requirements-modos.txt

      - name: Resolve and verify version tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          case "$VERSION" in
            v*) ;;
            *) echo "Version must begin with v" >&2; exit 1 ;;
          esac
          git rev-parse --verify "refs/tags/$VERSION" >/dev/null
          TARGET="$(git rev-list -n 1 "$VERSION")"
          test "$TARGET" = "$GITHUB_SHA" || {
            echo "Workflow commit does not match tag target: $GITHUB_SHA != $TARGET" >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Run complete MODOS convergence suite
        run: python ci/run-modos-convergence.py --continue-on-failure

      - name: Require a clear public current tree and reachable history
        run: |
          python ci/scan-public-history.py \
            --mode all \
            --report artifacts/release-public-history-sensitivity.json

      - name: Build reproducible validation package
        run: python ci/build-modos-validation-package.py --source-commit "${{ steps.version.outputs.target }}"

      - name: Write release notes
        shell: bash
        run: |
          NAME="${GITHUB_REPOSITORY#*/}"
          cat > RELEASE_NOTES.md <<EOF
          # $NAME ${{ steps.version.outputs.version }}

          Verified tagged release for $NAME.

          - Source commit: ${{ steps.version.outputs.target }}
          - MODOS convergence suite: passed
          - Public current tree and reachable history: sensitivity-clear
          - Reproducible validation package: generated and digest-bound

          GitHub provides source ZIP and source tarball assets automatically.
          EOF

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ steps.version.outputs.target }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" artifacts/pleiades-modos-validation.tar.gz artifacts/validation-package-receipt.json --clobber
            gh release edit "$VERSION" --target "$TARGET" --title "${GITHUB_REPOSITORY#*/} $VERSION" --notes-file RELEASE_NOTES.md
          else
            gh release create "$VERSION" \
              artifacts/pleiades-modos-validation.tar.gz \
              artifacts/validation-package-receipt.json \
              --verify-tag \
              --target "$TARGET" \
              --title "${GITHUB_REPOSITORY#*/} $VERSION" \
              --notes-file RELEASE_NOTES.md
          fi

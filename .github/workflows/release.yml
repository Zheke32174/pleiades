name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-lean-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify immutable release identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "$TAG" = "v$version"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git diff --cached --quiet
          git rev-parse --verify "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release identity already exists and will not be edited: $TAG" >&2
            exit 1
          fi

      - name: Validate lean defensive invariants
        run: bash ci/check-lean-security.sh lean

      - name: Scan public tree and reachable Git history
        run: python3 ci/scan_public_repo.py

      - name: Build exact tagged lean source package
        run: python3 scripts/package_lean_source.py --output dist

      - name: Verify checksums and release boundary
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS.txt
          python3 - <<'PY'
          import json
          import os
          import pathlib

          version = pathlib.Path('../VERSION').read_text(encoding='utf-8').strip()
          receipt = json.loads(pathlib.Path(f'pleiades-lean-{version}.build-receipt.json').read_text(encoding='utf-8'))
          assert receipt['version'] == version
          assert receipt['commit'] == os.environ['GITHUB_SHA']
          assert receipt['release_component'] == 'lean'
          assert receipt['distribution'] == 'reviewed-source'
          assert receipt['contains_historical_root_runtime'] is False
          assert receipt['contains_experimental_recovery'] is False
          assert receipt['contains_modos_pdk'] is False
          assert receipt['contains_runtime_state'] is False
          assert receipt['contains_event_records'] is False
          assert receipt['contains_credentials'] is False
          assert receipt['contains_signing_keys'] is False
          assert receipt['contains_stage3_or_rootfs'] is False
          assert receipt['contains_container_or_vm_image'] is False
          assert receipt['installs_or_enables_services_during_build'] is False
          assert receipt['deployment_receipt'] is False
          PY

      - name: Write download-first release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          cat > RELEASE_NOTES.md <<EOF
          # Pleiades lean ${TAG}

          Download **pleiades-lean-${version}.tar.gz** and verify it against **SHA256SUMS.txt** before extraction.

          This is a deterministic source release for the supported `lean/` defensive runtime. It is not a Gentoo stage3, root filesystem, WSL distribution, OCI/VM image, credential bundle, evidence export, live deployment, or service activation.

          Verification assets:

          - pleiades-lean-${version}.spdx.json
          - pleiades-lean-${version}.build-receipt.json
          - SHA256SUMS.txt

          Read README.md and RELEASE_SCOPE.md before use. Build and run verification inside a reviewed Gentoo container; container creation and host lifecycle belong to `pleiades-container`.

          Historical `root.x86_64`, experimental recovery material, and the unintegrated MODOS/PDK authority chain are intentionally excluded from this archive.
          EOF

      - name: Create release once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release create "$TAG" \
            "dist/pleiades-lean-${version}.tar.gz" \
            "dist/pleiades-lean-${version}.spdx.json" \
            "dist/pleiades-lean-${version}.build-receipt.json" \
            "dist/SHA256SUMS.txt" \
            --verify-tag \
            --title "Pleiades lean ${TAG}" \
            --notes-file RELEASE_NOTES.md

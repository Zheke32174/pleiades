name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing version tag, for example v0.1.0'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${GITHUB_REF_NAME:-$INPUT_VERSION}"
          if [[ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
            git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1 || {
              echo "ERROR: tag $VERSION does not exist"
              exit 1
            }
          fi
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "ERROR: invalid release tag: $VERSION"
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        shell: bash
        run: |
          NAME="${GITHUB_REPOSITORY#*/}"
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]'):${{ steps.version.outputs.version }}"
          cat > RELEASE_NOTES.md <<EOF
          # $NAME ${{ steps.version.outputs.version }}

          Defensive research release built from a version tag after repository checks.

          GitHub Package:
          \`$IMAGE\`

          GitHub also provides source ZIP and source tarball assets automatically.
          EOF

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --target "$VERSION" --title "${GITHUB_REPOSITORY#*/} $VERSION" --notes-file RELEASE_NOTES.md
          else
            gh release create "$VERSION" --target "$VERSION" --title "${GITHUB_REPOSITORY#*/} $VERSION" --notes-file RELEASE_NOTES.md
          fi

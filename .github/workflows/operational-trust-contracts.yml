name: Operational trust contracts

on:
  pull_request:
    paths:
      - 'modos/contracts/operational-authority-registry.schema.json'
      - 'modos/contracts/evidence-attestation.schema.json'
      - 'modos/contracts/operator-evidence-trust-receipt.schema.json'
      - 'modos/contracts/transition-authorization-candidate.schema.json'
      - 'modos/contracts/transition-preflight-receipt.schema.json'
      - 'modos/trust/**'
      - 'ci/validate-operational-trust.py'
      - 'requirements-modos.txt'
      - '.github/workflows/operational-trust-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operational-trust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input -r requirements-modos.txt
      - run: python ci/validate-operational-trust.py
      - run: python modos/trust/test_evidence.py
      - run: python modos/trust/test_preflight.py

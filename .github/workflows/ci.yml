name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Shell syntax (hard fail) ──────────────────────────────────────────────
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n all scripts
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "SYNTAX ERROR: $f"; fail=1; }
          done < <(find . -name '*.sh' -not -path './.git/*')
          exit $fail

  # ── ShellCheck (advisory) ────────────────────────────────────────────────
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: ShellCheck (warnings only — not a hard fail)
        run: find . -name '*.sh' -not -path './.git/*' -exec shellcheck --severity=warning {} + 2>&1 || true

  # ── Prohibited public language (hard fail) ───────────────────────────────
  wording-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for prohibited public wording in docs and READMEs
        run: |
          bad=$(grep -rniE \
            'selfdestruct|dead[[:space:]]drop|black-level|self-obfuscate|credential harvester|wipe traces|mutual persistence|BIOS-level hook|survive deletion|anti-lobotomy|anti-cryostasis|mirror dimension|RESURRECT signal|rehydrat' \
            README.md DISCLAIMER.md SECURITY.md CONTRIBUTING.md docs/ 2>/dev/null || true)
          if [ -n "$bad" ]; then
            echo "ERROR: Prohibited public wording found:"
            echo "$bad"
            exit 1
          fi
          echo "Wording check passed."

  # ── Secret-shape scan (hard fail) ────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secret patterns
        run: |
          hits=$(grep -rniE \
            'AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9_-]{20,}|ya29\.|BEGIN OPENSSH PRIVATE KEY|BEGIN RSA PRIVATE KEY|BEGIN EC PRIVATE KEY|AIza[0-9A-Za-z-_]{35}' \
            --exclude-dir=.git \
            --exclude='*.md' \
            . 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "ERROR: Potential secret pattern detected:"
            echo "$hits"
            exit 1
          fi
          echo "Secret scan passed."

  # ── Python syntax (hard fail) ────────────────────────────────────────────
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile-check all Python files
        run: |
          fail=0
          while IFS= read -r f; do
            python3 -m py_compile "$f" || { echo "SYNTAX ERROR: $f"; fail=1; }
          done < <(find . -name '*.py' -not -path './.git/*')
          exit $fail

  # ── Repo hygiene (hard fail) ─────────────────────────────────────────────
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files present
        run: |
          fail=0
          for f in README.md LICENSE SECURITY.md DISCLAIMER.md; do
            [ -f "$f" ] || { echo "MISSING: $f"; fail=1; }
          done
          exit $fail
      - name: No .env files committed
        run: |
          hits=$(find . -name '.env' -not -path './.git/*' -not -name '.env.example' 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "ERROR: .env file committed: $hits"
            exit 1
          fi
          echo "No .env files found."

  # ── Polyglot heredoc syntax (hard fail) ─────────────────────────────────
  polyglot-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - name: Install Rust parser
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Check polyglot heredoc syntax (Go/Rust/JS)
        run: |
          chmod +x ci/check-polyglot.sh
          bash ci/check-polyglot.sh root.x86_64/scripts

  # ── Draft-branch formatter (scoped auto-correction) ─────────────────────
  pdk-autofmt:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/modos/epoch-0-canon-and-pdk' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modos/epoch-0-canon-and-pdk
      - name: Install rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Format PDK workspace
        working-directory: modos/pdk-node-agent
        run: cargo fmt --all
      - name: Commit formatter-only changes
        run: |
          if git diff --quiet -- modos/pdk-node-agent; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modos/pdk-node-agent
          git commit -m "style(pdk): apply cargo fmt"
          git push origin HEAD:modos/epoch-0-canon-and-pdk

  # ── PDK Rust workspace (hard fail) ──────────────────────────────────────
  pdk-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modos/pdk-node-agent
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust with lint and format components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Install Protobuf compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-features
      - name: Build release workspace
        run: cargo build --release --workspace --all-features

  # ── DevContainer (advisory) ──────────────────────────────────────────────
  devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate devcontainer.json if present
        run: |
          if [ -f ".devcontainer/devcontainer.json" ]; then
            python3 -m json.tool .devcontainer/devcontainer.json > /dev/null && echo "devcontainer.json valid"
          else
            echo "No devcontainer.json (optional)"
          fi

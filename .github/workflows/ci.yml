name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Shell syntax (hard fail) ──────────────────────────────────────────────
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n all scripts
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "SYNTAX ERROR: $f"; fail=1; }
          done < <(find . -name '*.sh' -not -path './.git/*')
          exit $fail

  # ── ShellCheck (advisory) ────────────────────────────────────────────────
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: ShellCheck (warnings only — not a hard fail)
        run: find . -name '*.sh' -not -path './.git/*' -exec shellcheck --severity=warning {} + 2>&1 || true

  # ── Prohibited public language (hard fail) ───────────────────────────────
  wording-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for prohibited public wording in docs and READMEs
        run: |
          # These terms must not appear in public-facing docs.
          # They may appear in experimental/ scripts with appropriate framing.
          bad=$(grep -rniE \
            'selfdestruct|dead[[:space:]]drop|black-level|self-obfuscate|credential harvester|wipe traces|mutual persistence|BIOS-level hook|survive deletion|anti-lobotomy|anti-cryostasis|mirror dimension|RESURRECT signal|rehydrat' \
            README.md DISCLAIMER.md SECURITY.md CONTRIBUTING.md docs/ 2>/dev/null || true)
          if [ -n "$bad" ]; then
            echo "ERROR: Prohibited public wording found:"
            echo "$bad"
            exit 1
          fi
          echo "Wording check passed."

  # ── Secret-shape scan (hard fail) ────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secret patterns
        run: |
          hits=$(grep -rniE \
            'AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9_-]{20,}|ya29\.|BEGIN OPENSSH PRIVATE KEY|BEGIN RSA PRIVATE KEY|BEGIN EC PRIVATE KEY|AIza[0-9A-Za-z-_]{35}' \
            --exclude-dir=.git \
            --exclude='*.md' \
            . 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "ERROR: Potential secret pattern detected:"
            echo "$hits"
            exit 1
          fi
          echo "Secret scan passed."

  # ── Python syntax (hard fail) ────────────────────────────────────────────
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile-check all Python files
        run: |
          fail=0
          while IFS= read -r f; do
            python3 -m py_compile "$f" || { echo "SYNTAX ERROR: $f"; fail=1; }
          done < <(find . -name '*.py' -not -path './.git/*')
          exit $fail

  # ── Repo hygiene (hard fail) ─────────────────────────────────────────────
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files present
        run: |
          fail=0
          for f in README.md LICENSE SECURITY.md DISCLAIMER.md; do
            [ -f "$f" ] || { echo "MISSING: $f"; fail=1; }
          done
          exit $fail
      - name: No .env files committed
        run: |
          hits=$(find . -name '.env' -not -path './.git/*' -not -name '.env.example' 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "ERROR: .env file committed: $hits"
            exit 1
          fi
          echo "No .env files found."

  # ── DevContainer (advisory) ──────────────────────────────────────────────
  devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate devcontainer.json if present
        run: |
          if [ -f ".devcontainer/devcontainer.json" ]; then
            python3 -m json.tool .devcontainer/devcontainer.json > /dev/null && echo "devcontainer.json valid"
          else
            echo "No devcontainer.json (optional)"
          fi

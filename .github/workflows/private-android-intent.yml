name: Reusable private Android build and release

on:
  workflow_call:
    inputs:
      publish_release:
        description: Publish or update the downloadable APK Release
        required: false
        type: boolean
        default: false
      verify_release_signing:
        description: Run the strict release-signing verification task
        required: false
        type: boolean
        default: false
      java_version:
        required: false
        type: string
        default: '17'
      gradle_version:
        required: false
        type: string
        default: '8.10.2'
      android_platform:
        required: false
        type: string
        default: 'android-35'
      build_tools_version:
        required: false
        type: string
        default: '35.0.0'
      assemble_task:
        required: false
        type: string
        default: 'assembleDebug'
      test_task:
        required: false
        type: string
        default: 'test'
      apk_glob:
        required: false
        type: string
        default: '**/build/outputs/apk/**/*.apk'
      release_signing_task:
        required: false
        type: string
        default: 'assembleRelease verifyCertPin -PrequireSignedRelease=true'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ inputs.gradle_version }}
      - name: Install Android SDK components
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;${{ inputs.android_platform }}" "build-tools;${{ inputs.build_tools_version }}" > /dev/null
      - name: Assemble debug APKs
        shell: bash
        run: gradle --no-daemon ${{ inputs.assemble_task }}
      - name: Run unit tests
        shell: bash
        run: gradle --no-daemon ${{ inputs.test_task }}
      - name: Upload CI APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: ${{ inputs.apk_glob }}
          if-no-files-found: error
      - name: Prepare release assets
        if: inputs.publish_release
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY#*/}"
          mkdir -p dist
          count=0
          while IFS= read -r -d '' apk; do
            rel="${apk#./}"
            module="${rel%%/build/*}"
            base="$(basename "$apk" .apk)"
            safe="$(printf '%s-%s' "$module" "$base" | tr '/ ' '--')"
            cp "$apk" "dist/${repo}-${safe}.apk"
            count=$((count + 1))
          done < <(find . -path '*/build/outputs/apk/*' -type f -name '*.apk' ! -name '*androidTest*' -print0 | sort -z)
          test "$count" -gt 0
          (cd dist && sha256sum ./*.apk > SHA256SUMS)
      - name: Publish normal Latest release and verify downloads
        if: inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY#*/}"
          tag="continuous-apk"
          verified_tag="android-release-verified"
          cat > release-notes.md <<EOF
          ## Downloadable Android build

          This is an assembled, installable Android APK release from the selected release-intent commit.

          - Signing: Android CI debug key
          - Source commit: ${GITHUB_SHA}
          - APK variants: every generated non-test debug APK is attached below
          - Integrity: verify APKs against the attached SHA256SUMS file
          - Source: GitHub automatically provides Source code (zip) and Source code (tar.gz)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --target "$GITHUB_SHA" --title "$repo Android APK Release" --notes-file release-notes.md --draft=false --prerelease=false --latest
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$repo Android APK Release" --notes-file release-notes.md --latest
          fi
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          test "$(grep -Ec '\.apk$' <<< "$assets")" -ge 1
          grep -Fxq 'SHA256SUMS' <<< "$assets"
          test "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = false
          test "$(gh release view "$tag" --json isPrerelease --jq '.isPrerelease')" = false
          test -n "$(gh release view "$tag" --json zipballUrl --jq '.zipballUrl')"
          test -n "$(gh release view "$tag" --json tarballUrl --jq '.tarballUrl')"
          release_url="$(gh release view "$tag" --json url --jq '.url')"
          printf '### Download\n[%s Android APK Release](%s)\n' "$repo" "$release_url" >> "$GITHUB_STEP_SUMMARY"
          git tag -f "$verified_tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$verified_tag"

  release-signing-check:
    if: inputs.verify_release_signing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ inputs.gradle_version }}
      - name: Install Android SDK components
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;${{ inputs.android_platform }}" "build-tools;${{ inputs.build_tools_version }}" > /dev/null
      - name: Assemble release and verify certificate pin
        shell: bash
        run: gradle --no-daemon ${{ inputs.release_signing_task }}

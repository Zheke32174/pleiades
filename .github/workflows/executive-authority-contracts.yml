name: Executive authority contracts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - run: python ci/validate-executive-authority.py
      - run: python modos/governance/test_executive.py
      - run: python -m py_compile ci/validate-executive-authority.py modos/governance/executive.py modos/governance/test_executive.py

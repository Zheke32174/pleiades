name: Validate promotion review eligibility

on:
  push:
    branches:
      - main
    paths:
      - 'modos/contracts/promotion-review-eligibility-bundle.schema.json'
      - 'modos/PROMOTION_REVIEW_ELIGIBILITY.md'
      - 'ci/validate-promotion-review-eligibility.py'
      - '.github/workflows/promotion-review-eligibility.yml'
  pull_request:
    paths:
      - 'modos/contracts/promotion-review-eligibility-bundle.schema.json'
      - 'modos/PROMOTION_REVIEW_ELIGIBILITY.md'
      - 'ci/validate-promotion-review-eligibility.py'
      - '.github/workflows/promotion-review-eligibility.yml'

permissions:
  contents: read

concurrency:
  group: promotion-review-eligibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned validator
        run: python -m pip install --disable-pip-version-check --no-input jsonschema==4.25.1
      - name: Compile validator
        run: python -m py_compile ci/validate-promotion-review-eligibility.py
      - name: Validate schema and adversarial generations
        run: python ci/validate-promotion-review-eligibility.py

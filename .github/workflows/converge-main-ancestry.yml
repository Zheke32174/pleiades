name: Converge exact main ancestry

on:
  push:
    branches:
      - governance/convergence-proof-v1
    paths:
      - '.github/workflows/converge-main-ancestry.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: converge-main-ancestry-governance-v1
  cancel-in-progress: false

jobs:
  merge-reviewed-main-parent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: governance/convergence-proof-v1
          show-progress: false

      - name: Verify exact reviewed parents and content reconciliation
        shell: bash
        env:
          EXPECTED_MAIN: ce40d41d3cb712aef20416b1227edb3d19e988f5
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          actual_main="$(git rev-parse origin/main)"
          test "$actual_main" = "$EXPECTED_MAIN" || {
            echo "main moved beyond the reviewed collision map: $actual_main != $EXPECTED_MAIN" >&2
            exit 1
          }
          python ci/validate-convergence-metadata.py \
            --report artifacts/pre-merge-convergence-metadata.json
          test "$(python - <<'PY'
          import json
          print(json.load(open('modos/convergence/mainline-collision-map.json'))['remainingConflicts'])
          PY
          )" = "[]"

      - name: Add main as a second parent without changing the reviewed tree
        shell: bash
        env:
          EXPECTED_MAIN: ce40d41d3cb712aef20416b1227edb3d19e988f5
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "$EXPECTED_MAIN" HEAD; then
            echo "Reviewed main commit is already an ancestor."
            exit 0
          fi
          before_tree="$(git rev-parse HEAD^{tree})"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff -s ours "$EXPECTED_MAIN" \
            -m "Converge reviewed main ancestry into governance proof"
          after_tree="$(git rev-parse HEAD^{tree})"
          test "$before_tree" = "$after_tree" || {
            echo "ours-strategy merge changed the reviewed tree" >&2
            exit 1
          }
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
          git push origin HEAD:governance/convergence-proof-v1

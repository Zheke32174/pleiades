name: Validate MODOS convergence

on:
  push:
    paths:
      - 'MODOS_COMPONENT.yaml'
      - 'modos/**'
      - 'ci/**'
      - '.github/workflows/modos-convergence.yml'
  pull_request:
    paths:
      - 'MODOS_COMPONENT.yaml'
      - 'modos/**'
      - 'ci/**'
      - '.github/workflows/modos-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modos-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          jsonschema==4.26.0 PyYAML==6.0.2
      - name: Compile convergence executables
        run: |
          python -m py_compile \
            ci/validate-contract-catalog.py \
            ci/validate-ecology.py \
            ci/run-modos-convergence.py \
            modos/ontology/ecology_adapter.py
      - name: Run complete convergence suite
        run: python ci/run-modos-convergence.py --continue-on-failure
      - name: Compile public ecology ontology projection
        if: always()
        run: |
          mkdir -p artifacts
          python modos/ontology/ecology_adapter.py \
            --registry modos/ecology/public-ecology.json \
            --schema modos/contracts/ecology-registry.schema.json \
            --out-snapshot artifacts/public-ecology-ontology.json \
            --out-receipt artifacts/public-ecology-ontology-receipt.json
      - name: Upload convergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modos-convergence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

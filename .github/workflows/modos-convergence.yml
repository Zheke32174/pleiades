name: Validate MODOS convergence

on:
  push:
    paths:
      - 'MODOS_COMPONENT.yaml'
      - 'requirements-modos.txt'
      - 'modos/**'
      - 'ci/**'
      - '.github/CODEOWNERS'
      - '.github/workflows/modos-convergence.yml'
  pull_request:
    paths:
      - 'MODOS_COMPONENT.yaml'
      - 'requirements-modos.txt'
      - 'modos/**'
      - 'ci/**'
      - '.github/CODEOWNERS'
      - '.github/workflows/modos-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modos-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          -r requirements-modos.txt
      - name: Compile convergence executables
        run: |
          python -m py_compile \
            ci/validate-contract-catalog.py \
            ci/validate-ecology.py \
            ci/validate-stack-manifest.py \
            ci/validate-convergence-metadata.py \
            ci/validate-operator-runbooks.py \
            ci/scan-public-history.py \
            ci/build-modos-validation-package.py \
            ci/run-modos-convergence.py \
            modos/ontology/ecology_adapter.py \
            modos/convergence/synthetic_rehearsal.py \
            modos/convergence/intervention_frontier.py
          bash -n ci/run-modos-offline.sh
      - name: Run complete convergence suite
        run: python ci/run-modos-convergence.py --continue-on-failure
      - name: Compile public ecology ontology projection
        if: always()
        run: |
          mkdir -p artifacts
          python modos/ontology/ecology_adapter.py \
            --registry modos/ecology/public-ecology.json \
            --schema modos/contracts/ecology-registry.schema.json \
            --out-snapshot artifacts/public-ecology-ontology.json \
            --out-receipt artifacts/public-ecology-ontology-receipt.json
      - name: Record reachable-history sensitivity status
        if: always()
        shell: bash
        run: |
          set +e
          python ci/scan-public-history.py \
            --mode history \
            --report artifacts/reachable-history-sensitivity-receipt.json
          status=$?
          set -e
          case "$status" in
            0) echo "reachable history sensitivity-clear" ;;
            2) echo "reachable history remains blocked by recorded findings" ;;
            *) exit "$status" ;;
          esac
      - name: Upload convergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modos-convergence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

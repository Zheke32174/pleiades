name: Ontology promotion evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check jsonschema referencing
      - run: python ci/validate-promotion-evidence.py
      - run: python modos/ontology/test_promotion.py
      - run: python -m py_compile ci/validate-promotion-evidence.py modos/ontology/promotion.py modos/ontology/test_promotion.py

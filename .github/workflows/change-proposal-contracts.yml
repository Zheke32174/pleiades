name: ChangeProposal contracts

# Hosted runners are not assumed available. Keep this as an optional manual
# convenience while the checked-in local validation receipt and reproducible
# commands provide the review evidence.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - run: python ci/validate-change-proposals.py
      - run: python modos/ontology/test_compiler.py
      - run: python modos/ontology/test_projection.py

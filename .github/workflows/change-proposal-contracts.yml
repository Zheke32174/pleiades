name: ChangeProposal contracts

on:
  pull_request:
    paths:
      - "modos/contracts/change-proposal.schema.json"
      - "modos/contracts/change-proposal.fixtures.json"
      - "ci/validate-change-proposals.py"
      - ".github/workflows/change-proposal-contracts.yml"
  push:
    branches:
      - "ontology/**"
    paths:
      - "modos/contracts/change-proposal.schema.json"
      - "modos/contracts/change-proposal.fixtures.json"
      - "ci/validate-change-proposals.py"
      - ".github/workflows/change-proposal-contracts.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - run: python ci/validate-change-proposals.py

name: Executive control plane contracts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - run: python ci/validate-executive-control-plane.py
      - run: python modos/governance/test_control_plane.py
      - run: python -m py_compile ci/validate-executive-control-plane.py modos/governance/policy.py modos/governance/registry.py modos/governance/execution.py modos/governance/competence.py modos/governance/control_plane_fixtures.py modos/governance/test_control_plane.py

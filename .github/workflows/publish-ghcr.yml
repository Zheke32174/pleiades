name: Publish GitHub Package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish'
        required: true
        default: 'v0.1.0'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate tag
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${GITHUB_REF_NAME:-$INPUT_TAG}"
          if [[ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
            git rev-parse "refs/tags/$TAG" >/dev/null 2>&1 || {
              echo "ERROR: tag $TAG does not exist"
              exit 1
            }
            git checkout --detach "$TAG"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "ERROR: invalid package tag: $TAG"
            exit 1
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Pleiades defensive research package
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}

      - name: Build and publish package
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.package
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

domain_id = "domain://pleiades/home"
node_id = "node://pleiades/alienware"
listen = "0.0.0.0:7543"
control_plane_uri = "https://controller.pdk.local:7443"
control_plane_server_name = "controller.pdk.local"
signing_key_file = "/etc/pleiades/keys/node-alienware-signing.json"
state_database = "/var/lib/pleiades/node-agent/audit.sqlite3"
power_class = "mains-high-power"
trust_zone = "home-core"
startup_mode = "managed"
heartbeat_interval_seconds = 5
heartbeat_timeout_seconds = 15
read_only_timeout_seconds = 120
lease_sweep_interval_seconds = 1
max_clock_skew_seconds = 30

[tls]
certificate_chain = "/etc/pleiades/pki/node-alienware.chain.pem"
private_key = "/etc/pleiades/pki/node-alienware.key.pem"
trust_bundle = "/etc/pleiades/pki/ca.cert.pem"

[[trusted_controllers]]
controller_id = "controller://pleiades/alienware-primary"
key_id = "controller-alienware-ed25519-v1"
public_key_base64 = "REPLACE_WITH_PDK_KEYGEN_OUTPUT"
enabled = true

[[mtls_peers]]
identity = "controller://pleiades/alienware-primary"
role = "controller"
certificate_sha256 = "REPLACE_WITH_FINGERPRINT_FROM_BOOTSTRAP"
required_uri_san = "spiffe://pleiades.local/controller/alienware-primary"

syntax = "proto3";

package pleiades.pdk.v1;

import "google/protobuf/empty.proto";

enum NodeState {
  NODE_STATE_UNSPECIFIED = 0;
  NODE_STATE_CONNECTED = 1;
  NODE_STATE_DEGRADED_AUTONOMOUS = 2;
  NODE_STATE_READ_ONLY_SAFE = 3;
  NODE_STATE_STANDALONE = 4;
  NODE_STATE_QUARANTINED = 5;
}

enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_HEALTHY = 1;
  HEALTH_STATUS_DEGRADED = 2;
  HEALTH_STATUS_UNHEALTHY = 3;
}

enum WorkloadState {
  WORKLOAD_STATE_UNSPECIFIED = 0;
  WORKLOAD_STATE_PREPARED = 1;
  WORKLOAD_STATE_RUNNING = 2;
  WORKLOAD_STATE_STOPPED = 3;
  WORKLOAD_STATE_FAILED = 4;
  WORKLOAD_STATE_UNKNOWN = 5;
}

enum CapabilityAction {
  CAPABILITY_ACTION_UNSPECIFIED = 0;
  CAPABILITY_ACTION_SPAWN_WORKLOAD = 1;
  CAPABILITY_ACTION_STOP_WORKLOAD = 2;
  CAPABILITY_ACTION_STATUS_WORKLOAD = 3;
  CAPABILITY_ACTION_RESTART_LOCAL_HEALTH = 4;
  CAPABILITY_ACTION_WRITE_PROVISIONAL_EVENT = 5;
}

enum OfflinePolicy {
  OFFLINE_POLICY_UNSPECIFIED = 0;
  OFFLINE_POLICY_DENY = 1;
  OFFLINE_POLICY_FINISH_CURRENT = 2;
  OFFLINE_POLICY_BOUNDED_CACHE = 3;
}

message CpuInventory {
  string architecture = 1;
  uint32 logical_cores = 2;
  uint32 physical_cores = 3;
  string brand = 4;
  uint32 global_usage_milli_percent = 5;
}

message MemoryInventory {
  uint64 total_bytes = 1;
  uint64 available_bytes = 2;
  uint64 used_bytes = 3;
}

message DiskInventory {
  string name = 1;
  string file_system = 2;
  string mount_point = 3;
  uint64 total_bytes = 4;
  uint64 available_bytes = 5;
  bool read_only = 6;
  bool removable = 7;
}

message NetworkInterfaceInventory {
  string name = 1;
  uint64 total_received_bytes = 2;
  uint64 total_transmitted_bytes = 3;
}

message RuntimeCapability {
  string name = 1;
  bool available = 2;
  string version = 3;
  string probe_detail = 4;
}

message NodeInventory {
  uint64 collected_at_unix_ms = 1;
  string hostname = 2;
  string os_name = 3;
  string os_version = 4;
  string kernel_version = 5;
  string architecture = 6;
  uint64 uptime_seconds = 7;
  CpuInventory cpu = 8;
  MemoryInventory memory = 9;
  repeated DiskInventory disks = 10;
  repeated NetworkInterfaceInventory network_interfaces = 11;
  repeated RuntimeCapability runtimes = 12;
  bool gpu_present = 13;
  string power_class = 14;
  string trust_zone = 15;
}

message HeartbeatPayload {
  uint32 protocol_version = 1;
  string domain_id = 2;
  string node_id = 3;
  string boot_id = 4;
  uint64 sequence = 5;
  uint64 sent_at_unix_ms = 6;
  string agent_version = 7;
  NodeState node_state = 8;
  HealthStatus health = 9;
  NodeInventory inventory = 10;
}

message SignedHeartbeat {
  string key_id = 1;
  HeartbeatPayload payload = 2;
  string signature_base64 = 3;
}

message HeartbeatAckPayload {
  string ack_id = 1;
  string domain_id = 2;
  string controller_id = 3;
  string node_id = 4;
  string boot_id = 5;
  uint64 accepted_sequence = 6;
  uint64 accepted_at_unix_ms = 7;
  uint64 suggested_interval_seconds = 8;
  string authority_mode = 9;
}

message SignedHeartbeatAck {
  string key_id = 1;
  HeartbeatAckPayload payload = 2;
  string signature_base64 = 3;
}

message IsolationConstraints {
  bool network_denied = 1;
  bool read_only_root = 2;
  bool private_tmp = 3;
  bool protect_home = 4;
  bool no_new_privileges = 5;
  bool dynamic_user = 6;
  bool restrict_suid_sgid = 7;
  bool restrict_address_families = 8;
  uint64 memory_max_bytes = 9;
  uint32 cpu_quota_percent = 10;
  string cgroup_slice = 11;
}

message CapabilityGrantPayload {
  uint32 protocol_version = 1;
  string token_id = 2;
  string domain_id = 3;
  string issuer_id = 4;
  string subject_workload_id = 5;
  string target_node_id = 6;
  string lease_id = 7;
  repeated CapabilityAction actions = 8;
  uint64 issued_at_unix_ms = 9;
  uint64 not_before_unix_ms = 10;
  uint64 expires_at_unix_ms = 11;
  string policy_version = 12;
  string nonce = 13;
  IsolationConstraints maximum_isolation = 14;
  bool singleton_destructive = 15;
  uint64 grant_sequence = 16;
  uint32 max_uses = 17;
  OfflinePolicy offline_policy = 18;
  string policy_digest_sha256 = 19;
}

message SignedCapabilityGrant {
  string key_id = 1;
  CapabilityGrantPayload payload = 2;
  string signature_base64 = 3;
}

message CapabilityGrantAck {
  string token_id = 1;
  bool accepted = 2;
  string message = 3;
}

message WorkloadSpec {
  string workload_id = 1;
  string executable = 2;
  repeated string args = 3;
  map<string, string> environment = 4;
  string working_directory = 5;
  IsolationConstraints isolation = 6;
  bool singleton_destructive = 7;
}

message SpawnWorkloadRequest {
  string trace_id = 1;
  string capability_token_id = 2;
  string lease_id = 3;
  WorkloadSpec workload = 4;
}

message StopWorkloadRequest {
  string trace_id = 1;
  string capability_token_id = 2;
  string workload_id = 3;
  string reason = 4;
}

message GetWorkloadStatusRequest {
  string trace_id = 1;
  string capability_token_id = 2;
  string workload_id = 3;
}

message WorkloadReceipt {
  string workload_id = 1;
  string runtime = 2;
  string runtime_object_id = 3;
  WorkloadState state = 4;
  uint64 observed_at_unix_ms = 5;
  string detail = 6;
}

message DomainEventPayload {
  uint32 protocol_version = 1;
  string event_id = 2;
  string domain_id = 3;
  string source_node_id = 4;
  uint64 created_at_unix_ms = 5;
  string trace_id = 6;
  string event_type = 7;
  bytes payload_json = 8;
}

message SignedDomainEvent {
  string key_id = 1;
  DomainEventPayload payload = 2;
  string signature_base64 = 3;
}

message EventAckPayload {
  string ack_id = 1;
  string domain_id = 2;
  string controller_id = 3;
  string event_id = 4;
  uint64 accepted_at_unix_ms = 5;
}

message SignedEventAck {
  string key_id = 1;
  EventAckPayload payload = 2;
  string signature_base64 = 3;
}

message AgentStatus {
  string domain_id = 1;
  string node_id = 2;
  NodeState node_state = 3;
  uint64 last_controller_ack_unix_ms = 4;
  uint64 cached_capability_count = 5;
  uint64 pending_audit_event_count = 6;
}

service ControlPlane {
  rpc RegisterNode(SignedHeartbeat) returns (SignedHeartbeatAck);
  rpc Heartbeat(SignedHeartbeat) returns (SignedHeartbeatAck);
  rpc SubmitEvent(SignedDomainEvent) returns (SignedEventAck);
}

service NodeAgent {
  rpc PushCapabilityGrant(SignedCapabilityGrant) returns (CapabilityGrantAck);
  rpc SpawnWorkload(SpawnWorkloadRequest) returns (WorkloadReceipt);
  rpc StopWorkload(StopWorkloadRequest) returns (WorkloadReceipt);
  rpc GetWorkloadStatus(GetWorkloadStatusRequest) returns (WorkloadReceipt);
  rpc GetAgentStatus(google.protobuf.Empty) returns (AgentStatus);
}
